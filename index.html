<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActionPulse AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-400">⚡ ActionPulse AI</h1>
      <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-3 py-1 rounded-full">IDEASTORM 2026</span>
    </div>
  </header>

  <!-- Tab Navigation -->
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex border-b border-slate-800 mb-6">
      <button id="tabUpload" onclick="switchTab('upload')" class="px-6 py-2 border-b-2 border-indigo-500 font-semibold text-sm text-indigo-400">1. Upload & Extract</button>
      <button id="tabDashboard" onclick="switchTab('dashboard')" class="px-6 py-2 border-b-2 border-transparent font-semibold text-sm text-slate-400 hover:text-slate-200">2. Action Items Dashboard</button>
    </div>

    <!-- Views -->
    <div id="viewUpload" class="block">
      <h2 class="text-lg font-semibold mb-2">Meeting Transcript Input</h2>
      <p class="text-xs text-slate-400 mb-4">Paste transcript text or upload audio to generate structured action items.</p>
    </div>

    <div id="viewDashboard" class="hidden">
      <h2 class="text-lg font-semibold mb-2">Task Completion Dashboard</h2>
      <p class="text-xs text-slate-400 mb-4">Track assigned responsibilities, deadlines, and completion progress.</p>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      if (tab === 'upload') {
        document.getElementById('viewUpload').classList.remove('hidden');
        document.getElementById('viewDashboard').classList.add('hidden');
        document.getElementById('tabUpload').className = "px-6 py-2 border-b-2 border-indigo-500 font-semibold text-sm text-indigo-400";
        document.getElementById('tabDashboard').className = "px-6 py-2 border-b-2 border-transparent font-semibold text-sm text-slate-400 hover:text-slate-200";
      } else {
        document.getElementById('viewUpload').classList.add('hidden');
        document.getElementById('viewDashboard').classList.remove('hidden');
        document.getElementById('tabDashboard').className = "px-6 py-2 border-b-2 border-indigo-500 font-semibold text-sm text-indigo-400";
        document.getElementById('tabUpload').className = "px-6 py-2 border-b-2 border-transparent font-semibold text-sm text-slate-400 hover:text-slate-200";
      }
    }
  </script>
</body>
</html>
